<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<title>Listbox</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>
		<style>
			.list-group {
				position: relative;
				max-height: 293px;
				visibility: hidden;
				opacity: 0;
			}

			.list-group.is-active {
				visibility: visible;
				opacity: 1;
			}

			.list-group-item.is-active {
				z-index: 2;
				color: #fff;
				background-color: #007bff;
				border-color: #007bff;
			}

			.Alert {
				margin: 1em;
				position: fixed;
				top: 0;
				bottom: 0;
				right: 0;
				z-index: 10;
			}
		</style>
		<script type="module" crossorigin src="./assets/index-BxMoFFVl.js"></script>
	</head>

	<body>
		<div class="Alert js-alert"></div>
		<div class="container">
			<div class="my-5 row">
				<div class="col-12">
					<h1 class="m-0">
						<a href="https://github.com/19h47/19h47-listbox">Listbox</a>
					</h1>
				</div>
			</div>
			<div class="my-5 row">
				<div class="col-12">
					<div id="monster" class="p-3 border rounded-lg js-list">
						<h2 id="monster-label">Choose an monster <sup class="js-keys"></sup></h2>
						<button
							id="monster-button"
							class="my-3 btn btn-outline-primary w-100 js-list-button"
							aria-haspopup="listbox"
							aria-labelledby="monster-label monster-button"
							type="button"
						>
							<span class="js-list-label">Monsters</span>
						</button>
						<div class="overflow-hidden border rounded-lg" style="height: 293px">
							<ul
								class="overflow-auto list-group list-group-flush js-list-box"
								tabindex="-1"
								role="listbox"
								aria-labelledby="monster-label"
							></ul>
						</div>
					</div>
				</div>
			</div>
			<div class="my-5 row">
				<div class="col-12">
					<div class="p-3 border rounded-lg js-list" id="spells">
						<h2 id="spells-label">Choose an spells<sup class="js-keys"></sup></h2>
						<p>(select on focus)</p>
						<button
							id="spells-button"
							class="my-3 btn btn-outline-primary js-list-button w-100"
							aria-haspopup="listbox"
							aria-labelledby="spells-label spells-button"
							type="button"
						>
							<span class="js-list-label">Spells</span>
						</button>
						<div class="overflow-hidden border rounded-lg">
							<ul
								class="overflow-auto list-group list-group-flush js-list-box"
								tabindex="-1"
								role="listbox"
								aria-labelledby="spells-label"
								aria-multiselectable="true"
							></ul>
						</div>
					</div>
				</div>
			</div>
		</div>

	</body>
</html>
